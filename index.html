<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");
    const topicLabels = { delivery: "Доставка", pricing: "Стоимость", other: "Другое" };
    let latestRequestId = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++latestRequestId;
      const text = message.value;
      result.textContent = "Разбираем заявку…"; // Immediately remove any previous draft.

      if (!text.trim()) {
        result.textContent = "Введите текст заявки.";
        return;
      }

      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await reply.json();
        if (requestId !== latestRequestId) return; // Ignore out-of-order responses.

        if (reply.ok && data.status === "ready") {
          result.textContent = [
            "Тема: " + topicLabels[data.topic],
            "",
            "Черновик ответа:",
            data.draft,
            "",
            "Проверьте текст перед отправкой клиенту.",
          ].join("\n");
        } else if (reply.status === 400 && data.status === "invalid_input") {
          result.textContent = "Введите корректный текст заявки.";
        } else {
          result.textContent = "Автоматически разобрать заявку не удалось. Требуется ручной разбор. Черновик не создан.";
        }
      } catch {
        if (requestId === latestRequestId) {
          result.textContent = "Сервис недоступен. Требуется ручной разбор. Черновик не создан.";
        }
      }
    });
  </script>
</body>
</html>
